<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Vocabulary | Selection Collector</title>
  <link rel="stylesheet" href="saved.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand"><span class="logo" aria-hidden="true">✦</span><div><p class="eyebrow">SELECTION COLLECTOR</p><h1>My Vocabulary</h1><p class="subtitle">Your saved words and phrases, all in one place.</p></div></div>
      <span class="count" id="count">0 saved</span>
    </header>
    <section class="toolbar" aria-label="Vocabulary controls">
      <label class="search-label" for="search">Search vocabulary<input id="search" type="search" placeholder="Search words or source pages…"></label>
      <label for="sort">Sort by<select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">A to Z</option><option value="za">Z to A</option></select></label>
      <label for="theme">Appearance<select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></label>
      <label for="size">Text size<select id="size"><option value="normal">Normal</option><option value="large">Large</option></select></label>
    </section>
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <ul id="phrases" class="phrase-list" aria-label="Saved vocabulary"></ul>
  </main>
  <script src="saved.js"></script>
</body>
</html>
