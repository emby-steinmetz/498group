<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saved phrases</title>
</head>
<body>
  <h1>Saved phrases</h1>

  <!-- Google Login -->
  <button id="google-login" type="button">
    Sign in with Google
  </button>

  <button id="save-logout" type="button" hidden>
    Save &amp; Log Out
  </button>

  <p id="google-login-status" role="status"></p>

  <!-- Import words from a JSON file -->
  <button id="import-button" type="button">
    📁 Import Wordbank
  </button>

  <button id="export-button" type="button">
    Export Wordbank
  </button>

  <p id="export-status" role="status"></p>

  <input
    id="import-file"
    type="file"
    accept=".json,application/json"
    hidden
  >

  <p id="import-status" role="status"></p>

  <!-- Existing saved phrases -->
  <ul id="phrases"></ul>

  <script src="saved.js"></script>
  <script src="google-login.js"></script>
</body>
</html>
